name: Release

on:
  push:
    tags:
      - "v*"
      - "py-v*"
      - "gui-v*"

permissions:
  contents: write

jobs:
  python-wheels:
    name: Python wheels (${{ matrix.os }})
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'py-v')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Python wheels
        uses: pypa/cibuildwheel@v2.18.1
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ENVIRONMENT_MACOS: >
            MACOSX_DEPLOYMENT_TARGET=10.15
            CMAKE_ARGS="-DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
          CIBW_TEST_COMMAND: >
            python -c "import flowplot; print(flowplot.get_complete_json('{\"version\":\"1.0\"}', False)[:20])"
        with:
          package-dir: Python
          output-dir: wheelhouse

      - name: Upload Python wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  python-sdist:
    name: Python sdist
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Python sdist
        run: |
          python -m pip install build
          cd Python
          python -m build --sdist

      - name: Upload Python sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: Python/dist/*.tar.gz

  gui:
    name: FlowPlotGUI (${{ matrix.name }})
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'gui-v')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: windows
            cpack_generator: "ZIP;NSIS"

          - name: Linux
            os: ubuntu-22.04
            artifact_name: linux
            cpack_generator: "TGZ;DEB"

          - name: macOS
            os: macos-latest
            artifact_name: macos
            cpack_generator: DragNDrop

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools \
            libvulkan-dev \
            libglfw3-dev \
            libgtk-3-dev \
            libfreetype6-dev \
            zlib1g-dev \
            libpng-dev \
            dpkg-dev \
            fakeroot \
            file \
            libfuse2 \
            wget

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install glfw freetype libpng zlib

      - name: Install Vulkan SDK
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          vcpkg install glfw3:x64-windows freetype:x64-windows libpng:x64-windows zlib:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            EXTRA_ARGS+=("-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}")
          fi

          MACOS_ARGS=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            MACOS_ARGS+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi

          cmake -S FlowPlotGUI -B build-gui \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLOWPLOTGUI_ENABLE_DEV_MODE=OFF \
            -DCPACK_GENERATOR="${{ matrix.cpack_generator }}" \
            "${MACOS_ARGS[@]}" \
            "${EXTRA_ARGS[@]}"

      - name: Build
        run: cmake --build build-gui --config Release

      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --install build-gui --config Release --component Runtime --prefix bundle-test
          APP="bundle-test/FlowPlotGUI.app"
          test -x "$APP/Contents/MacOS/FlowPlotGUI"
          test -f "$APP/Contents/Resources/assets/Fonts/Inter.arfont"
          test -f "$APP/Contents/Resources/shaders/flowui_ui_solid.vert.spv"
          test -f "$APP/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json"
          test -f "$APP/Contents/Frameworks/libMoltenVK.dylib"
          otool -L "$APP/Contents/MacOS/FlowPlotGUI"

      - name: Package
        run: cpack -C Release --config build-gui/CPackConfig.cmake

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --install build-gui --config Release --component Runtime --prefix AppDir/usr

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          VERSION="${GITHUB_REF_NAME#gui-v}"
          VERSION="${VERSION#v}"
          export VERSION
          export APPIMAGE_EXTRACT_AND_RUN=1

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/FlowPlotGUI \
            --desktop-file AppDir/usr/share/applications/io.github.flowplot.FlowPlotGUI.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/FlowPlotGUI.png \
            --output appimage

      - name: Collect GUI packages
        shell: bash
        run: |
          mkdir -p gui-dist
          find . -maxdepth 2 \( \
            -name "*.zip" -o \
            -name "*.exe" -o \
            -name "*.tar.gz" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.dmg" \
          \) -exec cp {} gui-dist/ \;

      - name: Upload GUI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowPlotGUI-${{ matrix.artifact_name }}
          path: gui-dist/*

  github-release:
    name: Create GitHub Release
    needs: [python-wheels, python-sdist, gui]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release and upload files
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

  pypi:
    name: Publish Python package to PyPI
    needs: [python-wheels, python-sdist]
    if: startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/FlowPlotPy

    permissions:
      id-token: write

    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
